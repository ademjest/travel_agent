name: Travel Agent regression
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Full regression and offline scenarios need headroom on Windows runners.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -c constraints-py311.txt
      - run: python -m pip check
      - run: python scripts/check_secrets.py --all-tracked
      - run: python -X utf8 scripts/run_release_checks.py --checks backend task_scenarios read_only architecture --timeout 2400 --output .upgrade-testing/ci-backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-evaluation-${{ matrix.os }}
          path: .upgrade-testing/ci-backend
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: python -X utf8 ../scripts/run_release_checks.py --checks frontend build --output ../.upgrade-testing/ci-web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-checks
          path: .upgrade-testing/ci-web
